<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="vinylBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24242d" />
      <stop offset="60%" stop-color="#121217" />
      <stop offset="95%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#18181f" />
    </radialGradient>
    <radialGradient id="labelBg" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="50%" stop-color="#ee5253" />
      <stop offset="100%" stop-color="#b33939" />
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.12" />
      <stop offset="45%" stop-color="white" stop-opacity="0" />
      <stop offset="55%" stop-color="white" stop-opacity="0" />
      <stop offset="100%" stop-color="white" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Outer Vinyl Edge -->
  <circle cx="256" cy="256" r="248" fill="#08080a" stroke="#2a2a35" stroke-width="6" />
  <circle cx="256" cy="256" r="240" fill="url(#vinylBg)" />

  <!-- Grooves -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="#252530" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#1c1c24" stroke-width="2"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#272733" stroke-width="1.2" stroke-dasharray="14 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#1b1b22" stroke-width="1.8"/>
  <circle cx="256" cy="256" r="154" fill="none" stroke="#252532" stroke-width="1.2"/>
  <circle cx="256" cy="256" r="136" fill="none" stroke="#1d1d26" stroke-width="2" stroke-dasharray="10 5" opacity="0.5"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#22222d" stroke-width="1.5"/>

  <!-- Light Sheen Cone / Shimmer -->
  <circle cx="256" cy="256" r="240" fill="url(#sheen)" />

  <!-- Center Label -->
  <circle cx="256" cy="256" r="82" fill="url(#labelBg)" stroke="#f7d794" stroke-width="3" />
  
  <!-- Label Stylized Typography / Graphic -->
  <circle cx="256" cy="256" r="72" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="5 3" opacity="0.4"/>
  <path d="M 230 256 A 26 26 0 0 1 282 256 A 26 26 0 0 1 230 256" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8"/>

  <!-- Center Spindle Hole -->
  <circle cx="256" cy="256" r="16" fill="#08080a" stroke="#d1d8e0" stroke-width="2" />
</svg>
